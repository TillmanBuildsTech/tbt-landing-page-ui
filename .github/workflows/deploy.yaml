name: Vercel Production Deployment

# Production deploys on every push to `main` — direct pushes and merged PRs
# alike (the owner pushes straight to main, so the trigger is the push itself,
# not the merge event). Preview deployments from `dev` are automatic
# (preview.yaml); nothing here fires on dev pushes.
# Tests must pass before the deploy runs — the deploy job needs the test job.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  test:
    name: Unit tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Build
        run: npm run build

  deploy-production:
    name: Deploy production to Vercel
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel production
        # Remote build (no --prebuilt): required for Vercel Web Analytics —
        # prebuilt deployments don't serve /_vercel/insights/script.js and
        # analytics never tracks.
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
